<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            height: 10vh;
            margin: auto;
            background-color: aquamarine;
        }

        .container {
            border-sizing: border-box;
            border: 2px solid black;
            /* width: 2048px; */
            width: 80vw;
            /* height: 80vh; */
            margin: 23px auto;
            font-size: 18px;
            background-color: aquamarine;
           min-height: 80vh;
        }

        .container p {
            font-size: 1em ; /*2rem; */
            border : 2px solid rgb(96, 29, 29);
            width: 50%;
         
        }

        .mycont {
            border-sizing: border-box;
            border: 2px solid black;
            margin: 23px auto;
            color: red;
            font-size: 22px;
            /* width: 100vmin; */
            width: 80vw;

        }
    </style>
</head>

<body>
    <div class="box">
        this is a box
    </div>
    <div class="container">
        <p>
            <!-- Expend this to see that this  container will adjust its lorem999 -->
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit deserunt aspernatur quia velit enim soluta
            amet cumque, error dolores voluptas unde libero facilis molestiae odio quidem cupiditate dolor? Doloremque,
            deleniti?
        </p>
    </div>
    <div class="mycont">
        I am another container
    </div>
</body>

</html>
